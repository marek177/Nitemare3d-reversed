name: Win16 NE timer binary proof regression

on:
  push:
    paths:
      - 'tools/n3d_win16_timer_binary_proof.py'
      - 'tools/n3d_win16_timer_crossversion_verify.py'
      - 'tools/n3d_win16_timer_target_census.py'
      - 'tests/test_n3d_win16_timer_target_census.py'
      - 'docs/WIN16_TIMER_TARGET_INDIRECT_CENSUS_20261020.md'
      - 'tests/test_n3d_win16_timer_crossversion.py'
      - 'tests/test_n3d_win16_timer_archive_v110.py'
      - 'docs/WIN16_V110_TIMER_ARCHIVED_BYTE_CLOSURE_20261020.md'
      - 'other/n3d/builds_12/static_byte_evidence/N3D_Win16_NE3_anchors.csv'
      - 'other/n3d/builds_12/static_byte_evidence/N3D_Win16_reloc_anchored_import_CALLs.csv'
      - 'tools/ne_renderer_audit.py'
      - 'tests/test_n3d_win16_timer_binary_proof.py'
      - 'docs/WIN16_TIMER_BINARY_PROOF_20261019.md'
      - '.github/workflows/win16-timer-ne-proof.yml'
  pull_request:
    paths:
      - 'tools/n3d_win16_timer_binary_proof.py'
      - 'tools/n3d_win16_timer_crossversion_verify.py'
      - 'tools/n3d_win16_timer_target_census.py'
      - 'tests/test_n3d_win16_timer_target_census.py'
      - 'docs/WIN16_TIMER_TARGET_INDIRECT_CENSUS_20261020.md'
      - 'tests/test_n3d_win16_timer_crossversion.py'
      - 'tests/test_n3d_win16_timer_archive_v110.py'
      - 'docs/WIN16_V110_TIMER_ARCHIVED_BYTE_CLOSURE_20261020.md'
      - 'other/n3d/builds_12/static_byte_evidence/N3D_Win16_NE3_anchors.csv'
      - 'other/n3d/builds_12/static_byte_evidence/N3D_Win16_reloc_anchored_import_CALLs.csv'
      - 'tools/ne_renderer_audit.py'
      - 'tests/test_n3d_win16_timer_binary_proof.py'
      - 'docs/WIN16_TIMER_BINARY_PROOF_20261019.md'
      - '.github/workflows/win16-timer-ne-proof.yml'

jobs:
  synthetic-ne-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install 16-bit disassembler
        run: python -m pip install capstone==5.0.9
      - name: Compile Python verification scripts
        run: |
          python -m py_compile tools/ne_renderer_audit.py
          python -m py_compile tools/n3d_win16_timer_binary_proof.py
          python -m py_compile tools/n3d_win16_timer_crossversion_verify.py
          python -m py_compile tools/n3d_win16_timer_target_census.py
          python -m py_compile tests/test_n3d_win16_timer_target_census.py
          python -m py_compile tests/test_n3d_win16_timer_crossversion.py
          python -m py_compile tests/test_n3d_win16_timer_archive_v110.py
          python -m py_compile tests/test_n3d_win16_timer_binary_proof.py
      - name: Verify synthetic NE parser/ordinal relocations
        run: python -m unittest discover -s tests -p 'test_n3d_win16_timer_binary_proof.py' -v
      - name: Verify exact 1.8 to 1.10 timer-anchor mapping and proof limits
        run: |
          python tools/n3d_win16_timer_crossversion_verify.py --output /tmp/n3d-win16-timer-crossversion.json
          python -m unittest discover -s tests -p 'test_n3d_win16_timer_crossversion.py' -v
      - name: Verify archived Win16 v1.10 timer opcode model (synthetic only)
        run: python -m unittest discover -s tests -p 'test_n3d_win16_timer_archive_v110.py' -v
      - name: Classify timer-specific FAR fixups and indirect pointer candidates
        run: python -m unittest discover -s tests -p 'test_n3d_win16_timer_target_census.py' -v
      - name: Verify CLI has no original binary dependency
        run: python tools/n3d_win16_timer_binary_proof.py --help
