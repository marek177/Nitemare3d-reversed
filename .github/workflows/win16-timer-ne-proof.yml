jobs:
  synthetic-ne-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install 16-bit disassembler
        run: python -m pip install capstone==5.0.9
      - name: Compile Python verification scripts
        run: |
          python -m py_compile tools/ne_renderer_audit.py
          python -m py_compile tools/n3d_win16_timer_binary_proof.py
          python -m py_compile tools/n3d_win16_timer_crossversion_verify.py
          python -m py_compile tools/n3d_win16_timer_target_census.py
          python -m py_compile tools/n3d_win16_clock_alias_writes.py
          python -m py_compile tools/n3d_win16_raw_fixed_store_candidates.py
          python -m py_compile tools/n3d_win16_rep_destination_audit.py
          python -m py_compile tools/n3d_win16_memcpy_6c80_caller_audit.py
          python -m py_compile tools/n3d_win16_string_trio_lifecycle_audit.py
          python -m py_compile tools/n3d_win16_oom_callback_indirect_proof.py
          python -m py_compile tests/test_n3d_win16_oom_callback_indirect_proof.py
          python -m py_compile tests/test_n3d_win16_string_trio_lifecycle_audit.py
          python -m py_compile tests/test_n3d_win16_memcpy_6c80_caller_audit.py
          python -m py_compile tools/n3d_win16_filename_alias_calls.py
          python -m py_compile tests/test_n3d_win16_filename_alias_calls.py
          python -m py_compile tests/test_n3d_win16_rep_destination_audit.py
          python -m py_compile tests/test_n3d_win16_raw_fixed_store_candidates.py
          python -m py_compile tests/test_n3d_win16_clock_alias_writes.py
          python -m py_compile tests/test_n3d_win16_timer_target_census.py
          python -m py_compile tests/test_n3d_win16_timer_crossversion.py
          python -m py_compile tests/test_n3d_win16_timer_archive_v110.py
          python -m py_compile tests/test_n3d_win16_timer_binary_proof.py
      - name: Verify synthetic NE parser/ordinal relocations
        run: python -m unittest discover -s tests -p 'test_n3d_win16_timer_binary_proof.py' -v
      - name: Verify exact 1.8 to 1.10 timer-anchor mapping and proof limits
        run: |
          python tools/n3d_win16_timer_crossversion_verify.py --output /tmp/n3d-win16-timer-crossversion.json
          python -m unittest discover -s tests -p 'test_n3d_win16_timer_crossversion.py' -v
      - name: Verify archived Win16 v1.10 timer opcode model (synthetic only)
        run: python -m unittest discover -s tests -p 'test_n3d_win16_timer_archive_v110.py' -v
      - name: Classify timer-specific FAR fixups and indirect pointer candidates
        run: python -m unittest discover -s tests -p 'test_n3d_win16_timer_target_census.py' -v
      - name: Validate archived Win16 v1.10 clock/latch writer widths and no direct overlap
        run: |
          python tools/n3d_win16_clock_alias_writes.py --output /tmp/win16-clock-direct-writer-report.json
          python -m unittest discover -s tests -p 'test_n3d_win16_clock_alias_writes.py' -v
      - name: Verify raw NE byte candidate scanner overlap safety
        run: python -m unittest discover -s tests -p 'test_n3d_win16_raw_fixed_store_candidates.py' -v
      - name: Audit 83 Win16 REP sites (48 direct/conditional, 1 symbolic, 34 open)
        run: |
          python tools/n3d_win16_rep_destination_audit.py --output /tmp/n3d-win16-rep-dst-audit.json
          python -m unittest discover -s tests -p 'test_n3d_win16_rep_destination_audit.py' -v
      - name: Audit all eight Win16 6C80 memcpy caller edges and signed 16-bit length arithmetic
        run: |
          python tools/n3d_win16_memcpy_6c80_caller_audit.py --output /tmp/n3d-win16-memcpy8-caller-audit.json
          python -m unittest discover -s tests -p 'test_n3d_win16_memcpy_6c80_caller_audit.py' -v
      - name: Verify original Win16 empty buffer sentinel and conditional OOM scalar flag alias
        run: |
          python tools/n3d_win16_string_trio_lifecycle_audit.py --output /tmp/win16-string-trio-oom-alias.json
          python -m unittest discover -s tests -p 'test_n3d_win16_string_trio_lifecycle_audit.py' -v
      - name: Prove hidden Win16 OOM callback 1000 076A and indirect setter retry paths
        run: |
          python tools/n3d_win16_oom_callback_indirect_proof.py --output /tmp/win16-oom-hidden-report.json
          python -m unittest discover -s tests -p 'test_n3d_win16_oom_callback_indirect_proof.py' -v
      - name: Pin all twelve Win16 user.sav/config.sav direct filename paths
        run: |
          python tools/n3d_win16_filename_alias_calls.py --output /tmp/n3d-win16-filename-aliases.json
          python -m unittest discover -s tests -p 'test_n3d_win16_filename_alias_calls.py' -v
      - name: Verify CLI has no original binary dependency
        run: python tools/n3d_win16_timer_binary_proof.py --help
