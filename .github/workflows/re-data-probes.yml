permissions:
  contents: read

jobs:
  synthetic-data:
    name: Synthetic BSF/DEMO/trace fixtures (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: BSF fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_bsf_audit.py" -v
      - name: DEMO fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_demo_layout_probe.py" -v
      - name: FAST/RNG trace fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_n3d_trace_audit.py" -v
      - name: Differential trace fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_n3d_trace_compare.py" -v
      - name: Edge-case trace fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_n3d_edge_trace_compare.py" -v
      - name: Original-byte verification fixture tests (synthetic, no original EXE)
        run: python -m unittest discover -s tests -p "test_n3d_v032_static_verify.py" -v
      - name: PUSH updater binary-identity fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v033_push_verify.py" -v
      - name: OBJECT animation direct-call and opcode fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v034_animation_probe.py" -v
      - name: Corrected 22-site RNG census fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v035_rng_census.py" -v
      - name: Configure C++ evidence and push-safety tests (SDL disabled)
        run: cmake -S . -B build -DN3D_ENABLE_SDL3=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ trace and push-safety tests
        run: cmake --build build --config Release --target n3d_v029_scheduler_evidence_test n3d_v030_trace_closure_test n3d_pushable_blocked_test n3d_v022_version_evidence_registry_test n3d_v025_guard_writer_graph_test n3d_v032_static_closure_test n3d_v020_verification_harness_test n3d_v021_subsystem_evidence_test n3d_v033_push_scheduler_test n3d_v034_object_animation_evidence_test n3d_v026_guard_rng_coupling_test n3d_v035_rng_census_test
      - name: C++ evidence and push-safety tests (synthetic)
        run: ctest --test-dir build -C Release -R "^(n3d_v0(29_scheduler_evidence|30_trace_closure)_test|n3d_pushable_blocked_test)$" --output-on-failure
      - name: v0.32 static closure registry C++ tests
        run: ctest --test-dir build -C Release -R "^n3d_v0(22_version_evidence_registry|25_guard_writer_graph|32_static_closure)_test$" --output-on-failure
      - name: v0.33 scheduler/PUSH reference C++ tests
        run: ctest --test-dir build -C Release -R "^n3d_v0(20_verification_harness|21_subsystem_evidence|22_version_evidence_registry|29_scheduler_evidence|33_push_scheduler)_test$" --output-on-failure
      - name: v0.34 render-coupled object-animation C++ tests
        run: ctest --test-dir build -C Release -R "^n3d_v034_object_animation_evidence_test$" --output-on-failure
      - name: v0.35 RNG caller census and consumer C++ tests
        run: ctest --test-dir build -C Release -R "^n3d_v0(26_guard_rng_coupling|35_rng_census)_test$" --output-on-failure
