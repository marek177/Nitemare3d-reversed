name: N3D RE Python data probes

on:
  push:
    paths:
      - "tools/n3d_bsf_audit.py"
      - "tools/n3d_demo_layout_probe.py"
      - "tools/n3d_trace_audit.py"
      - "tools/n3d_trace_compare.py"
      - "tools/n3d_edge_trace_compare.py"
      - "tests/test_bsf_audit.py"
      - "tests/test_demo_layout_probe.py"
      - "tests/test_n3d_trace_audit.py"
      - "tests/test_n3d_trace_compare.py"
      - "tests/test_n3d_edge_trace_compare.py"
      - "src/game/LevelState.cpp"
      - "tests/pushable_blocked_test.cpp"
      - "docs/V031_REMAX_EDGE_CASE_CLOSURE.md"
      - "src/re/N3DV030TraceClosure.hpp"
      - "tests/v030_trace_closure_test.cpp"
      - "src/re/N3DV029SchedulerEvidence.hpp"
      - "tests/v029_scheduler_evidence_test.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/re-data-probes.yml"
  pull_request:
    paths:
      - "tools/n3d_bsf_audit.py"
      - "tools/n3d_demo_layout_probe.py"
      - "tools/n3d_trace_audit.py"
      - "tools/n3d_trace_compare.py"
      - "tools/n3d_edge_trace_compare.py"
      - "tests/test_bsf_audit.py"
      - "tests/test_demo_layout_probe.py"
      - "tests/test_n3d_trace_audit.py"
      - "tests/test_n3d_trace_compare.py"
      - "tests/test_n3d_edge_trace_compare.py"
      - "src/game/LevelState.cpp"
      - "tests/pushable_blocked_test.cpp"
      - "docs/V031_REMAX_EDGE_CASE_CLOSURE.md"
      - "src/re/N3DV030TraceClosure.hpp"
      - "tests/v030_trace_closure_test.cpp"
      - "src/re/N3DV029SchedulerEvidence.hpp"
      - "tests/v029_scheduler_evidence_test.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/re-data-probes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-data:
    name: Synthetic BSF/DEMO/trace fixtures (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: BSF fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_bsf_audit.py" -v
      - name: DEMO fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_demo_layout_probe.py" -v
      - name: FAST/RNG trace fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_n3d_trace_audit.py" -v
      - name: Differential trace fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_n3d_trace_compare.py" -v
      - name: Edge-case trace fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_n3d_edge_trace_compare.py" -v
      - name: Configure C++ evidence and push-safety tests (SDL disabled)
        run: cmake -S . -B build -DN3D_ENABLE_SDL3=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ trace and push-safety tests
        run: cmake --build build --config Release --target n3d_v029_scheduler_evidence_test n3d_v030_trace_closure_test n3d_pushable_blocked_test
      - name: C++ evidence and push-safety tests (synthetic)
        run: ctest --test-dir build -C Release -R "^(n3d_v0(29_scheduler_evidence|30_trace_closure)_test|n3d_pushable_blocked_test)$" --output-on-failure
