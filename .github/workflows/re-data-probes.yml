permissions:
  contents: read

jobs:
  synthetic-data:
    name: Synthetic BSF/DEMO/trace fixtures (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: BSF fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_bsf_audit.py" -v
      - name: DEMO fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_demo_layout_probe.py" -v
      - name: FAST/RNG trace fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_n3d_trace_audit.py" -v
      - name: Differential trace fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_n3d_trace_compare.py" -v
      - name: Edge-case trace fixture tests (no original game data)
        run: python -m unittest discover -s tests -p "test_n3d_edge_trace_compare.py" -v
      - name: Original-byte verification fixture tests (synthetic, no original EXE)
        run: python -m unittest discover -s tests -p "test_n3d_v032_static_verify.py" -v
      - name: PUSH updater binary-identity fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v033_push_verify.py" -v
      - name: OBJECT animation direct-call and opcode fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v034_animation_probe.py" -v
      - name: Corrected 22-site RNG census fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v035_rng_census.py" -v
      - name: Cross-version protected-hit ordering fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v036_protected_hit_probe.py" -v
      - name: DOS v2.0 quantized-clock and scheduler-gate fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v037_scheduler_gate_probe.py" -v
      - name: v0.38 three-day bounded-model fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v038_recent_models.py" -v
      - name: v0.39 late-day bounded-model fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v039_static_models.py" -v
      - name: v0.40 projectile reentry bounded-model fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v040_projectile_reentry.py" -v
      - name: v0.41 latest static-evidence fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v041_latest_static_models.py" -v
      - name: v0.42 October-18 bounded-model fixture tests (synthetic)
        run: python -m unittest discover -s tests -p "test_n3d_v042_oct18_models.py" -v
      - name: Configure C++ evidence and push-safety tests (SDL disabled)
