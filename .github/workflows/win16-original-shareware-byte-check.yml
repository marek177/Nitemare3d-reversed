name: Win16 original shareware byte check

on:
  push:
    paths:
      - '.github/workflows/win16-original-shareware-byte-check.yml'
      - 'tools/n3d_win16_timer_binary_proof.py'
      - 'tools/n3d_win16_timer_target_census.py'
      - 'tools/ne_renderer_audit.py'
  workflow_dispatch:

jobs:
  win16-v18-original-static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static disassembler
        run: python -m pip install capstone==5.0.9
      - name: Fetch PUBLIC Win16 v1.8 shareware ZIP, verify distribution checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 \
            'https://www.classicdosgames.com/files/games/gray/nite3w18.zip' \
            -o /tmp/nite3w18-shareware.zip
          python - <<'PY'
          from pathlib import Path
          from hashlib import md5
          p = Path('/tmp/nite3w18-shareware.zip')
          expected = '2caa732f42e5b8a9ac2930008bec724e'
          actual = md5(p.read_bytes()).hexdigest()
          print('Archive-size:', p.stat().st_size)
          print('Distribution-MD5:', actual)
          if actual != expected:
              raise SystemExit('Public historical download checksum mismatch')
          PY
      - name: Inspect archive member identities without executing binaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          import struct
          with ZipFile('/tmp/nite3w18-shareware.zip') as z:
              for item in z.infolist():
                  if not item.filename.lower().endswith('.exe') or item.file_size > 8_388_608:
                      continue
                  data = z.read(item)
                  print('member:', item.filename, 'bytes:', len(data),
                        'sha256:', sha256(data).hexdigest())
                  if len(data) < 0x100 or data[:2] != b'MZ':
                      print('  not MZ')
                      continue
                  ne = struct.unpack_from('<I', data, 0x3c)[0]
                  if data[ne:ne+2] != b'NE':
                      print('  MZ but no NE header')
                      continue
                  shift = struct.unpack_from('<H',data,ne+0x32)[0]
                  segtab = ne+struct.unpack_from('<H',data,ne+0x22)[0]
                  scnt = struct.unpack_from('<H',data,ne+0x1c)[0]
                  print('  NE header:', ne, 'segments:', scnt, 'alignment:', shift)
                  if scnt < 3: continue
                  sector,length,flags,minalloc = struct.unpack_from('<HHHH',data,segtab+2*8)
                  off=sector<<shift
                  size=length or 65536
                  print('  NE segment3:',off,size,
                        'sha256:',sha256(data[off:off+size]).hexdigest())
          PY
      - name: Diagnose fixed 1996 SFX wrapper without executing it
        shell: bash
        run: |
          python - <<'PY'
          from zipfile import ZipFile, is_zipfile
          from pathlib import Path
          import struct
          with ZipFile('/tmp/nite3w18-shareware.zip') as z:
              data = z.read('N3WUNR.EXE')
          out = Path('/tmp/n3wunr-wrapper.exe')
          out.write_bytes(data)
          print('Embedded SFX-wrapper recognized by zipfile:',is_zipfile(out))
          for magic in (bytes((80,75,3,4)),b'MSCF',b'SZDD',b'LZ91'):
              print('Marker',repr(magic),'count:',data.count(magic),'first:',data.find(magic))
          print('e_lfanew:',hex(struct.unpack_from('<I',data,0x3c)[0]))
          print('MZ header start:',data[:64].hex(' '))
          PY
          file /tmp/n3wunr-wrapper.exe || true
          if command -v 7z >/dev/null 2>&1; then
            7z l /tmp/n3wunr-wrapper.exe | head -70 || true
          else
            echo '7z not installed on runner'
          fi
      - name: Verify SHA-pinned original Win16 v1.8 NE and decode timer
        shell: bash
        run: |
          set -euo pipefail
          python tools/n3d_win16_timer_binary_proof.py \
            /tmp/nite3w18-shareware.zip --version 1.8 \
            --output /tmp/win16_v18_timer_evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/win16_v18_timer_evidence.json').read_text())
          print('Original build:',r['build'])
          print('Original SHA256:',r['source_sha256'])
          print('NE timer entry:',r['timer_init'])
          print('Import fixups validated:',sum(x['verified'] for x in r['verified_import_anchors']))
          proof = r['win18_timer_stack_proof']
          assert proof is not None
          print('Verified original Win16 v1.8 initializer:', proof['init_far_call'])
          print('Verified original Win16 v1.8 cleanup:', proof['cleanup_far_call'])
          print('Cleanup argument:', proof['time_end_period_argument'])
          print('CALLSITE with preceding assembly around timeEndPeriod:')
          for row in r['cleanup_call_context']:
              print(row['address'], row['bytes'], row['mnemonic'], row['operands'], row['relocations'])
          print('FULL original timer initialization / read-time ASM:')
          for row in r['timer_function_disassembly']:
              print('TIMER',row['address'],row['bytes'],row['mnemonic'],row['operands'],row['relocations'])
          print('E8 candidates:',r['candidate_near_E8_xrefs_to_timer_init'])
          print('NE fixup internal refs:',r['fixup_backed_internal_references_to_timer_init'])
          census = r['timer_target_specific_ne_census']
          print('Original expanded target NE fixups:', census['expanded_internal_relocations_to_target'])
          print('Original target relocation types:', census['classes'])
          print('Original direct FAR timer callers:', census['direct_far_call_sites'])
          print('Original timer address-taken/non-direct fixups:', census['non_direct_fixups_requiring_pointer_flow'])
          print('Original E8 raw near candidates:', census['raw_e8_near_call_candidates_unverified'])
          assert census['direct_far_call_sites'] == ['3:0EE8','3:0F24'], (
              'SHA-pinned original Win16 1.8 callers no longer match archived ASM')
          assert census['expanded_internal_relocations_to_target'] == 2
          assert not census['non_direct_fixups_requiring_pointer_flow']
          assert census['all_runtime_indirect_calls_excluded'] is False
          import sys
          import tempfile
          sys.path.insert(0, 'tools')
          from n3d_win16_timer_binary_proof import find_pinned_original, disassemble_region
          from ne_renderer_audit import NeImage
          _, binary, profile = find_pinned_original(Path('/tmp/nite3w18-shareware.zip'), '1.8')
          with tempfile.TemporaryDirectory() as tmp:
              exe = Path(tmp) / 'verified-original.exe'
              exe.write_bytes(binary)
              image = NeImage(exe)
              for begin,end in ((0x0EDA,0x0EF5),(0x0F16,0x0F35)):
                  print('Original NE3 caller window:',hex(begin),hex(end))
                  for row in disassemble_region(image, 3, begin, end):
                      print('CALLER',row['address'],row['bytes'],row['mnemonic'],row['operands'],row['relocations'])
          print('Note: source EXE or ZIP are never committed or uploaded as artifacts.')
          PY
