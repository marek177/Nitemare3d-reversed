name: Win16 v1.3-v1.6 SFX diagnostics (not byte parity)

on:
  push:
    paths:
      - '.github/workflows/win16-shareware-crossversion-timer.yml'
      - 'tools/n3d_win16_timer_binary_proof.py'
      - 'tools/ne_renderer_audit.py'
  workflow_dispatch:

jobs:
  inspect-historic-installers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disassembler (no original binary execution)
        run: python -m pip install capstone==5.0.9
      - name: Verify public Windows 1.3 and 1.6 game bytes with SHA-256
        shell: bash
        run: |
          set -euo pipefail
          while read -r ver archive checksum; do
            test -n "$ver" || continue
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 \
              "https://www.classicdosgames.com/files/games/gray/$archive" \
              -o "/tmp/$archive"
            python - "$archive" "$checksum" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          name, expected = sys.argv[1:]
          payload = Path('/tmp', name).read_bytes()
          md5 = hashlib.md5(payload).hexdigest()
          print('Distribution', name, 'size', len(payload), 'MD5', md5)
          if md5 != expected:
              raise SystemExit('Historic shareware checksum failed')
          PY
            python - "$archive" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          import struct
          sys.path.insert(0, 'tools')
          from n3d_win16_timer_binary_proof import iter_zip_exes
          from zipfile import ZipFile
          name = sys.argv[1]
          outer = Path('/tmp',name)
          with ZipFile(outer) as z:
              print('Outer entries:', [(x.filename, x.file_size) for x in z.infolist() if x.filename.lower().endswith(('.exe','.zip'))])
          for member, data in iter_zip_exes(outer.read_bytes(),name):
              print('EXE member',member,'size',len(data),'SHA256',hashlib.sha256(data).hexdigest())
              if len(data)>0x40 and data[:2]==b'MZ':
                  header = struct.unpack_from('<I',data,0x3c)[0]
                  if data[header:header+2]==b'NE':
                      count = struct.unpack_from('<H',data,header+0x1c)[0]
                      print('  NE segment count',count)
                      if count >= 3:
                          table = header+struct.unpack_from('<H',data,header+0x22)[0]+2*8
                          sector, length, flags, minimum = struct.unpack_from('<HHHH',data,table)
                          align = struct.unpack_from('<H',data,header+0x32)[0]
                          off = sector << align
                          print('  NE3 offset',off,'length',length or 65536,'sha256',
                                hashlib.sha256(data[off:off+(length or 65536)]).hexdigest())
          PY
            python - "$archive" "$ver" <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import sys
          archive, version = sys.argv[1:]
          with ZipFile(Path('/tmp',archive)) as z:
              members = [n for n in z.namelist() if n.lower().endswith('.exe')]
              if not members: raise SystemExit('No SFX EXE member in outer ZIP')
              sfx = z.read(members[0])
          out = Path('/tmp','outer-sfx-'+version+'.exe')
          out.write_bytes(sfx)
          print('SFX member',members[0],'stored at',out)
          PY
            if command -v 7z >/dev/null 2>&1; then
              echo "7z listing of original SFX $ver:"
              7z l "/tmp/outer-sfx-$ver.exe" | head -55 || true
            fi
            if ! python tools/n3d_win16_timer_binary_proof.py "/tmp/$archive" \
              --version "$ver" --output "/tmp/clock-$ver.json"; then
              echo "PINNED_ORIGINAL_NOT_FOUND for $ver; continuing to other release."
              continue
            fi
            python - "$ver" "$archive" <<'PY'
          import json
          from pathlib import Path
          import sys
          import tempfile
          sys.path.insert(0, 'tools')
          from ne_renderer_audit import NeImage
          from n3d_win16_timer_binary_proof import find_pinned_original
          ver, archive = sys.argv[1:]
          r = json.loads(Path('/tmp', 'clock-' + ver + '.json').read_text())
          print('VERIFIED',ver,r['source_sha256'],
                'NE3 clock entry',r['timer_init'],
                '5 imports',all(x['verified'] for x in r['verified_import_anchors']))
          for row in r['timer_function_disassembly']:
              print('TIMER',ver,row['address'],row['bytes'],
                    row['mnemonic'],row['operands'],row['relocations'])
          _, payload, profile = find_pinned_original(Path('/tmp',archive), ver)
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp, 'verified.exe')
              path.write_bytes(payload)
              img = NeImage(path)
              for reloc in r['fixup_backed_internal_references_to_timer_init']:
                  seg, at = reloc['source'].split(':')
                  seg, at = int(seg), int(at,16)
                  call_ip = at-3
                  raw = img.bytes_at(seg,call_ip,call_ip+5)
                  earlier = img.bytes_at(seg,call_ip-2,call_ip)
                  offset_word = int.from_bytes(raw[1:3], 'little')
                  print('FIXUP_CALL',ver,hex(call_ip),raw.hex(' '),
                        'target',hex(offset_word),'preceding',earlier.hex(' '),
                        'direct_far',(raw[0]==0x9a and offset_word==profile.timer_init))
          PY
          done <<'VERSIONS'
          1.3 nite3w13.zip fafd220e88e4dba66557d871a6703700
          1.6 nite3w16.zip 3678e96304ccc4ecb7aef269b889d132
          VERSIONS
