name: DOS GUARD resolver contract
on:
  push:
    paths: ['src/re/N3DDosGuardResolver.hpp', 'tests/dos_guard_resolver_test.cpp', '.github/workflows/dos-guard-resolver.yml']
  pull_request:
    paths: ['src/re/N3DDosGuardResolver.hpp', 'tests/dos_guard_resolver_test.cpp', '.github/workflows/dos-guard-resolver.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile strict C++20 and run bounded scenarios
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -Isrc tests/dos_guard_resolver_test.cpp -o /tmp/guard-resolver
          /tmp/guard-resolver
