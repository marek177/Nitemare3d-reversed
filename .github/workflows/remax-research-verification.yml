name: RE MAX archive regression
on:
  push:
    paths:
      - 'worx/**'
      - 'other/worx/**'
      - 'other/n3d/**'
      - '.github/workflows/remax-research-verification.yml'
  pull_request:
    paths:
      - 'worx/**'
      - 'other/worx/**'
      - 'other/n3d/**'
      - '.github/workflows/remax-research-verification.yml'

jobs:
  worx-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure audio reference (original EXEs never committed)
        run: cmake -S other/worx -B build-worx -DCMAKE_BUILD_TYPE=Release
      - name: Build C++17 audio subcontracts
        run: cmake --build build-worx --config Release --parallel 2
      - name: Execute synthetic and pinned-evidence tests
        run: ctest --test-dir build-worx -C Release --output-on-failure
      - name: Run GUARD v0.58 synthetic Python regressions
        run: python -m unittest discover -s other/n3d/v058/tests -p 'test_v058.py'
      - name: Verify WORX-only source folder contract
        run: python other/worx/tools/check_source_layout.py
