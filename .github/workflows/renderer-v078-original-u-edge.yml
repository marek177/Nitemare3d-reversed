name: N3D v078 original DOS2 texture-U edge closure

on:
  push:
    paths:
      - 'src/re/N3DDos20TextureUEdge.hpp'
      - 'src/re/N3DDos20WallMaterialBinding.hpp'
      - 'tests/dos20_texture_u_edge_test.cpp'
      - '.github/workflows/renderer-v078-original-u-edge.yml'
      - 'CMakeLists.txt'
      - 'cmake/RegressionTests.cmake'
  pull_request:
    paths:
      - 'src/re/N3DDos20TextureUEdge.hpp'
      - 'src/re/N3DDos20WallMaterialBinding.hpp'
      - 'tests/dos20_texture_u_edge_test.cpp'
      - '.github/workflows/renderer-v078-original-u-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native_texture_u:
    name: DOS2 original edge U (C++20)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure no original commercial game files
        run: cmake -S . -B build-v078 -DN3D_ENABLE_SDL3=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Compile edge algorithm and integrated IMG material binder
        run: cmake --build build-v078 --config Debug --target n3d_dos20_texture_u_edge_test n3d_dos20_wall_material_binding_test --parallel 4
      - name: Run synthetic 22CA and material binder regressions
        run: ctest --test-dir build-v078 -C Debug -R 'n3d_dos20_(texture_u_edge|wall_material_binding)_test' --output-on-failure
      - name: Strict GCC C++20 + undefined behavior sanitizer
        if: runner.os == 'Linux'
        run: |
          c++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -Isrc tests/dos20_texture_u_edge_test.cpp -o /tmp/n3d_v078_texture_u
          /tmp/n3d_v078_texture_u
