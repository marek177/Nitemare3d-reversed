name: V089 preview frame contract
on:
  push:
    paths:
      - 'src/re/N3DPreviewFrameTrace.hpp'
      - 'src/main.cpp'
      - 'tests/preview_frame_trace_test.cpp'
      - '.github/workflows/v089-preview-frame-contract.yml'
  pull_request:
    paths:
      - 'src/re/N3DPreviewFrameTrace.hpp'
      - 'src/main.cpp'
      - 'tests/preview_frame_trace_test.cpp'
jobs:
  serializer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test diagnostic serializer
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -Isrc tests/preview_frame_trace_test.cpp -o /tmp/preview_trace_test
          /tmp/preview_trace_test
