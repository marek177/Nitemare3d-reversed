name: Sprite pixel contract
on:
  push:
    paths: ['src/re/N3DDos20SpriteRaster.hpp', 'src/re/N3DV041FrameCompositor.hpp', 'tests/dos20_sprite_raster_test.cpp', 'tools/n3d_dos20_sprite_verify.py', '.github/workflows/sprite-pixel-contract.yml']
  pull_request:
    paths: ['src/re/N3DDos20SpriteRaster.hpp', 'src/re/N3DV041FrameCompositor.hpp', 'tests/dos20_sprite_raster_test.cpp', 'tools/n3d_dos20_sprite_verify.py', '.github/workflows/sprite-pixel-contract.yml']
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run bounded sprite contract
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -Isrc tests/dos20_sprite_raster_test.cpp -o /tmp/sprite-contract
          /tmp/sprite-contract
      - name: Check verifier syntax
        run: python3 -m py_compile tools/n3d_dos20_sprite_verify.py
