name: DOS2 wall snapshot replay
on:
  push:
    paths: ['src/re/**', 'src/formats/BinaryIO.*', 'tools/n3d_dos20_wall_replay.cpp', 'tests/test_dos20_wall_replay_cli.py', 'CMakeLists.txt', 'cmake/RegressionTests.cmake', '.github/workflows/renderer-wall-snapshot-replay.yml']
  pull_request:
    paths: ['src/re/**', 'src/formats/BinaryIO.*', 'tools/n3d_dos20_wall_replay.cpp', 'tests/test_dos20_wall_replay_cli.py', 'CMakeLists.txt', 'cmake/RegressionTests.cmake', '.github/workflows/renderer-wall-snapshot-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure without commercial assets
        run: cmake -S . -B build-replay -DN3D_ENABLE_SDL3=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build replay and component tests
        run: cmake --build build-replay --config Debug --target n3d_dos20_wall_replay n3d_dos20_cedc_projection_test n3d_dos20_wall_material_binding_test --parallel 4
      - name: Run synthetic integration and component checks
        run: ctest --test-dir build-replay -C Debug -R '^n3d_dos20_(wall_replay_cli|cedc_projection|wall_material_binding)_test$' --output-on-failure
      - name: Strict C++20 integration UBSan
        if: runner.os == 'Linux'
        run: |
          c++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -Isrc tools/n3d_dos20_wall_replay.cpp src/formats/BinaryIO.cpp -o /tmp/n3d_wall_replay
          python tests/test_dos20_wall_replay_cli.py --program /tmp/n3d_wall_replay -v
